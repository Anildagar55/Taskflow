services:
  taskflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-api:local
    container_name: taskflow-api
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
