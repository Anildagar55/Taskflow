name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Least privilege: read the code, write packages, nothing else.
permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 - Continuous Integration
  # Compiles the code and runs every test on each push and pull request.
  # If this job fails, nothing is published or deployed.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile, test and package
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-api-jar
          path: target/taskflow-api.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2 - Container image
  # Builds the Docker image, scans it for known vulnerabilities and only then
  # pushes it to GitHub Container Registry. Runs on main only, because a pull
  # request should never publish an image.
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Scan Image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ---------------------------------------------------------------------------
  # Stage 3 - Continuous Deployment
  # Pulls the freshly published image onto the target host and restarts the
  # container. Gated behind the "production" environment so the deployment
  # can require a manual approval in repository settings.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: http://${{ secrets.DEPLOY_HOST }}:8080/actuator/health

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop taskflow-api || true
            docker rm taskflow-api || true
            docker run -d --name taskflow-api --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke test the deployment
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.DEPLOY_HOST }}:8080/actuator/health" | grep -q UP; then
              echo "Deployment healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
